# render.yaml — one-click deploy blueprint for Render (https://render.com)
# Docs: https://render.com/docs/blueprint-spec
#
# In Render: New +  →  Blueprint  →  connect this repo. Render reads this file
# and creates the web service below. You'll be prompted for the secret values
# (Supabase connection, Anthropic API key, owner password) during setup.
#
# Storage is handled by Supabase (a hosted database), so client data persists
# across deploys — no disk needed. Run supabase/schema.sql in your Supabase
# project first (see README).

services:
  - type: web
    name: client-vaults
    runtime: node
    plan: free            # free tier: app sleeps after ~15 min idle
    branch: main          # deploy from the main branch
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true      # redeploy automatically on every push to the branch above
    healthCheckPath: /
    envVars:
      # Pin the Node.js major version (the app requires Node 20+).
      - key: NODE_VERSION
        value: "20"

      # --- Supabase (storage) ---
      # From your Supabase project: Project Settings → API.
      - key: SUPABASE_URL
        sync: false
      # The service_role key — a secret with full access. Server-side only.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- AI agent ---
      # Your Anthropic API key. The app still runs without it — the agent is
      # simply disabled.
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Owner protection ---
      # A password that protects the owner dashboard once it's public. Strongly
      # recommended: without it, anyone with the URL can see every client and use
      # the AI agent (which spends your API credits). Client access codes protect
      # the client portal separately.
      - key: OWNER_PASSWORD
        sync: false
